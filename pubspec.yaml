name: tomb_of_annihilation
description: "ToA DM Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/locations.json
    - assets/data/encounters.json
    - assets/data/trickster_gods.json
    - assets/data/monsters.json
    - assets/data/rumors.json
    - assets/data/puzzles.json
    - assets/data/guides.json
    - assets/data/dinosaurs.json
    - assets/data/factions.json
    - assets/images/
